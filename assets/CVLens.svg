plications</text></g><g transform="matrix(0.835127,0,0,1,29.1876,0)"><g transform="matrix(15.8333,0,0,15.8333,274.675,52.9394)"></g><g transform="matrix(15.8333,0,0,15.8333,279.801,52.9394)"></g><text x="177.031px" y="52.939px" style="font-family:'Arial-BoldItalicMT', 'Arial', sans-serif;font-weight:700;font-style:italic;font-size:15.833px;fill:#f0f6fc;stroke:#30363d;stroke-width:0.53px;stroke-linecap:butt;stroke-miterlimit:2;">against job oﬀers, providing a 1–10 score and detailed</text></g><g transform="matrix(0.835127,0,0,1,29.1876,0)"><g transform="matrix(15.8333,0,0,15.8333,287.022,69.2907)"></g><g transform="matrix(15.8333,0,0,15.8333,292.295,69.2907)"></g><text x="177.031px" y="69.291px" style="font-family:'Arial-BoldItalicMT', 'Arial', sans-serif;font-weight:700;font-style:italic;font-size:15.833px;fill:#f0f6fc;stroke:#30363d;stroke-width:0.53px;stroke-linecap:butt;stroke-miterlimit:2;">feedback. The ﬁnal decision remains with the recruiter<tspan x="585.132px " y="69.291px ">.</tspan></text></g></g><g transform="matrix(1,0,0,0.89472,0,1.31158)"><g transform="matrix(38.2343,0,0,38.2343,152.245,41.3179)"></g><text x="9.893px" y="41.318px" style="font-family:'Arial-BoldItalicMT', 'Arial', sans-serif;font-weight:700;font-style:italic;font-size:38.234px;fill:#f0f6fc;stroke:#30363d;stroke-width:0.44px;stroke-linecap:butt;stroke-miterlimit:2;">CVLens</text></g><path d="M21.805,42.416l134.938,0" style="fill:none;stroke:#ddfbff;stroke-width:3.28px;"/><path d="M37.097,123l336.202,0" style="fill:none;stroke:#ddfbff;stroke-width:2.5px;"/></svg>